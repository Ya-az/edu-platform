<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>منصة الاختبارات | Edu Platform</title>
    <!-- Tajawal Arabic Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      const isGithubPages = window.location.hostname.endsWith('github.io');
      const usesSourceEntry = !!document.querySelector(
        'script[type="module"][src*="src/main.jsx"]'
      );

      if (isGithubPages && usesSourceEntry && !window.location.pathname.includes('/docs/')) {
        const basePath = window.location.pathname.endsWith('/')
          ? window.location.pathname
          : `${window.location.pathname}/`;

        window.location.replace(
          `${window.location.origin}${basePath}docs/${window.location.hash}`
        );
      }
    </script>
    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
